# Local/CI target is DuckDB — free, in-process, zero setup.
# The generated models use only portable SQL (md5, concat_ws, date_trunc),
# so pointing the `snowflake` target at a real account runs the same project
# unchanged. That mirrors the original platform, which ran on Snowflake.
template_driven_ingestion:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('PLATFORM_DB', '../platform.duckdb') }}"
      threads: 4
