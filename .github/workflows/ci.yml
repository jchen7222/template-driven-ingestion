name: ci

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate models from templates
        run: make samples generate
      - name: Load raw data (idempotent, reconciled)
        run: make load
      - name: Build warehouse (dbt models + tests)
        run: make build
      - name: Enforce the versioned model contract
        run: make check
      - name: Unit tests
        run: make test
